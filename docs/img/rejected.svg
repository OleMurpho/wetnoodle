<svg xmlns='http://www.w3.org/2000/svg' width='760' height='332' viewBox='0 0 760 332' role='img' aria-label='Ideas that sounded good and were measured out'>
<rect width='760' height='332' fill='white'/>
<text x='18' y='30' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif' font-size='17' font-weight='600' fill='#1f2933'>Ideas that sounded good and were measured out</text>
<text x='18' y='52' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#7b8794'>Each one was built and run against the same questions, then dropped when it did not help</text>
<text x='18' y='72' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#7b8794'>bars to the left mean fewer questions answered first; to the right, more</text>
<line x1='506.0' y1='84' x2='506.0' y2='288' stroke='#1f2933' stroke-width='1.5'/>
<text x='18' y='108' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2933'>Short context line above every passage</text>
<rect x='396.0' y='94' width='110.0' height='18' rx='3' fill='#a4442f'/>
<text x='388.0' y='108' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#1f2933' text-anchor='end'>-7 questions</text>
<text x='18' y='148' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2933'>Session topic instead of full context</text>
<rect x='458.9' y='134' width='47.1' height='18' rx='3' fill='#a4442f'/>
<text x='450.9' y='148' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#1f2933' text-anchor='end'>-3 questions</text>
<text x='18' y='188' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2933'>Rare-term gate for identifier queries</text>
<rect x='490.3' y='174' width='15.7' height='18' rx='3' fill='#a4442f'/>
<text x='482.3' y='188' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#1f2933' text-anchor='end'>-1 question</text>
<text x='18' y='228' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2933'>Removing all 1,570 duplicate passages</text>
<rect x='506.0' y='214' width='2.0' height='18' rx='3' fill='#7b8794'/>
<text x='514.0' y='228' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#1f2933' text-anchor='start'>no change</text>
<text x='18' y='268' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2933'>Keyword boosting across the whole corpus</text>
<rect x='474.6' y='254' width='31.4' height='18' rx='3' fill='#a4442f'/>
<text x='466.6' y='268' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#1f2933' text-anchor='end'>-2 questions</text>
</svg>